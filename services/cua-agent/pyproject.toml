# Spike 结论（T8 Step 1，2026-10-05，证据见 .superpowers/sdd/2026-10-04-liepin-m1/task-8-report.md）：
#
# 接入路径选定（a）PyPI `cua-driver` SDK，钉 0.30.4 —— 与本机已装 Cua Driver
# 桌面应用（0.30.4，-NoAutoStart）同版。要点：
# - 官方 README（PyPI 0.30.4 元数据）：该包面向 client 应用
#   （from cua_driver import CuaDriver）；CuaDriver.create() 在导入进程内加载
#   Rust runtime，不依赖已装 exe/daemon；SDK 方法全 async，start_session 可选。
# - 路径（b）MCP client 排除：官方文档说明 Windows/Linux 上 `cua-driver mcp`
#   是自持 runtime 的 stdio server（面向 agent harness，非应用接入）；本机桌面
#   应用不暴露 MCP 端点（netstat/tasklist 无 cua 进程监听）。
# - 兼容性注记（消解风险 R1）：SDK 自带 bundled runtime，与已装应用版本解耦，
#   钉 0.30.4 仅为与用户交互探索所用桌面应用行为对齐；latest 为 0.33.3
#   （升级路径），但 README 预告下一 breaking release 引入 typed window API，
#   先不追新。0.30.4 有 win_amd64 wheel（28MB，py3-none）。

[project]
name = "hr-workbuddy-cua-agent"
version = "0.1.0"
description = "cua-agent 服务 — 猎聘页面驱动（Fake 剧本 / CUA SDK）+ 视觉校验大脑（spec v1.6）"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26",
    "cua-driver==0.30.4",
    "hr-workbuddy-contracts==0.1.0",
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "websockets>=17.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
hr-workbuddy-contracts = { workspace = true }
