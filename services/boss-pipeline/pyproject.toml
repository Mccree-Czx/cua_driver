[project]
name = "boss-pipeline"
version = "0.1.0"
description = "BOSS直聘 服务端 — 承接 agent_boss 采到的职位/候选人/会话数据"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "cryptography>=42", # PyMySQL 需要它完成 MySQL 8 默认的 caching_sha2_password 首次认证
    "fastapi>=0.115",
    # ★ 复用猎聘那份 `CandidateStatus` 枚举，**不在这里另立一份**。
    #   两边前端都要按状态上色/上标签，枚举一旦分叉就会各说各话。
    "hr-workbuddy-contracts==0.1.0",
    "httpx>=0.27",
    "minio>=7.2",
    "pydantic-settings>=2.2",
    "pymysql>=1.1",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.uv.sources]
hr-workbuddy-contracts = { workspace = true }
