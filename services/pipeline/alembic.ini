[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# URL intentionally empty: env.py reads it from pipeline Settings (DATABASE_URL,
# pydantic-settings). NOTE: keep this file ASCII-only - alembic reads it with
# locale encoding (GBK on zh-CN Windows), UTF-8 comments break parsing.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
